services:
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto
    command: mosquitto -c /dev/null -p 1883
    ports:
      - "1883:1883"

  consumer:
    container_name: consumer
    build:
      context: ..
      dockerfile: src_pipeline/dockerfiles/consumer.dockerfile
    env_file:
      - .env
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      - ./logs:/app/logs

  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: timescaledb
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # TODO: Set up Grafana dashboard and connect to TimescaleDB
  # Requires: GF_SECURITY_ADMIN credentials in .env

volumes:
  timescale_data:
