<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="t d"><title id="t">Smart Grow edge IoT architecture</title><desc id="d">Pico W reads temperature, humidity and light sensors, evaluates thresholds locally and drives LCD, buzzer and LED. JSON MQTT telemetry flows to Mosquitto, Python consumer and TimescaleDB. Grafana visualizes readings and Discord receives remote alerts.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061629"/><stop offset="1" stop-color="#0b3040"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#39d9c0" stroke-width="1.5"/></marker><style>.ey{font:700 13px Arial;letter-spacing:3px;fill:#42dfc7}.h{font:700 28px Arial;fill:#f3f8ff}.s{font:14px Arial;fill:#aec5d8}.n{fill:#103445;stroke:#168f83;stroke-width:1.5}.num{font:700 12px Arial;fill:#51e2ca}.lab{font:700 17px Arial;fill:#f5f9ff}.det{font:13px Arial;fill:#b2c7d7}.ar{fill:none;stroke:#39d9c0;stroke-width:2.3;marker-end:url(#a)}</style></defs><rect width="1500" height="700" rx="24" fill="url(#bg)"/><text x="48" y="54" class="ey">πCO · SMART GROW · EDGE IOT</text><text x="48" y="98" class="h">Environmental monitoring — telemetry architecture</text><text x="48" y="128" class="s">Local edge decisions first, followed by MQTT ingestion and remote monitoring</text><text x="48" y="182" class="ey">01 / SENSING &amp; EDGE CONTROL</text><g><rect class="n" x="48" y="208" width="340" height="170" rx="14"/><text x="70" y="238" class="num">01 · SENSOR INPUTS</text><text x="70" y="278" class="lab">Raspberry Pi Pico W</text><text x="70" y="312" class="det">DHT11 · temperature / humidity</text><text x="70" y="340" class="det">APDS-9999 · ambient light</text><rect class="n" x="448" y="208" width="340" height="170" rx="14"/><text x="470" y="238" class="num">02 · LOCAL EDGE LOGIC</text><text x="470" y="278" class="lab">Threshold evaluation</text><text x="470" y="312" class="det">Prepare JSON telemetry + alert flags</text><text x="470" y="340" class="det">Runs on-device, independent of cloud</text><rect class="n" x="848" y="208" width="270" height="170" rx="14"/><text x="870" y="238" class="num">LOCAL OUTPUTS</text><text x="870" y="278" class="lab">LCD · buzzer · LED</text><text x="870" y="312" class="det">Status display + immediate alarm</text><text x="870" y="340" class="det">Triggered by local thresholds</text></g><g class="ar"><path d="M388 292H439"/><path d="M788 292H839"/></g><path class="ar" d="M618 378V430H183V470"/><text x="390" y="422" class="det">Wi-Fi · JSON over MQTT</text><text x="48" y="470" class="ey">02 / MESSAGE INGESTION &amp; OBSERVABILITY</text><g><rect class="n" x="48" y="496" width="270" height="140" rx="14"/><text x="70" y="526" class="num">03 · BROKER</text><text x="70" y="566" class="lab">Mosquitto</text><text x="70" y="598" class="det">MQTT · QoS 1 · reconnect</text><rect class="n" x="408" y="496" width="270" height="140" rx="14"/><text x="430" y="526" class="num">04 · CONSUMER</text><text x="430" y="566" class="lab">Python consumer</text><text x="430" y="598" class="det">Subscribe · parse · persist</text><rect class="n" x="768" y="496" width="270" height="140" rx="14"/><text x="790" y="526" class="num">05 · STORAGE</text><text x="790" y="566" class="lab">TimescaleDB</text><text x="790" y="598" class="det">sensor_readings time series</text><rect class="n" x="1128" y="496" width="324" height="140" rx="14"/><text x="1150" y="526" class="num">06 · VISUALIZATION</text><text x="1150" y="566" class="lab">Grafana dashboard</text><text x="1150" y="598" class="det">Live + historical readings</text></g><g class="ar"><path d="M318 566H399"/><path d="M678 566H759"/><path d="M1038 566H1119"/></g><text x="48" y="674" class="det">Python consumer → Discord webhook: remote alert notifications when an alert flag is received · Docker Compose stack</text></svg>